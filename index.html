<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IPL Cricket Showdown</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>IPL Cricket Showdown</h1>

        <div class="ipl-logos-track">
            <div class="ipl-logos">
                <span class="ipl-logo" style="background:#FFCC00;color:#1a1a2e">CSK</span>
                <span class="ipl-logo" style="background:#004B93;color:#fff">MI</span>
                <span class="ipl-logo" style="background:#EC1C24;color:#fff">RCB</span>
                <span class="ipl-logo" style="background:#3A225D;color:#fff">KKR</span>
                <span class="ipl-logo" style="background:#004C93;color:#fff">DC</span>
                <span class="ipl-logo" style="background:#EA1A85;color:#fff">RR</span>
                <span class="ipl-logo" style="background:#FF822A;color:#fff">SRH</span>
                <span class="ipl-logo" style="background:#DD1F2D;color:#fff">PBKS</span>
                <span class="ipl-logo" style="background:#A4D9E7;color:#1a1a2e">LSG</span>
                <span class="ipl-logo" style="background:#0B4EA2;color:#fff">GT</span>
                <span class="ipl-logo" style="background:#FFCC00;color:#1a1a2e">CSK</span>
                <span class="ipl-logo" style="background:#004B93;color:#fff">MI</span>
                <span class="ipl-logo" style="background:#EC1C24;color:#fff">RCB</span>
                <span class="ipl-logo" style="background:#3A225D;color:#fff">KKR</span>
                <span class="ipl-logo" style="background:#004C93;color:#fff">DC</span>
                <span class="ipl-logo" style="background:#EA1A85;color:#fff">RR</span>
                <span class="ipl-logo" style="background:#FF822A;color:#fff">SRH</span>
                <span class="ipl-logo" style="background:#DD1F2D;color:#fff">PBKS</span>
                <span class="ipl-logo" style="background:#A4D9E7;color:#1a1a2e">LSG</span>
                <span class="ipl-logo" style="background:#0B4EA2;color:#fff">GT</span>
            </div>
        </div>

        <div id="teamSelection" class="team-selection">
            <h2>Select Your Team</h2>
            <div class="teams-grid" id="teamsGrid"></div>
        </div>

        <div id="gameArea" class="game-area" style="display: none;">
            <div class="match-info">
                <div class="team-display">
                    <div id="playerTeamLogo" class="team-logo"></div>
                    <span id="playerTeamName" class="team-name"></span>
                </div>
                <span class="vs">VS</span>
                <div class="team-display">
                    <div id="opponentTeamLogo" class="team-logo"></div>
                    <span id="opponentTeamName" class="team-name"></span>
                </div>
            </div>

            <div class="bat-ball" id="batBall">
                <div class="bat"></div>
                <div class="ball"></div>
            </div>

            <div class="scoreboard">
                <div class="score-item">
                    <span id="runsLabel" class="label">Your Score</span>
                    <span id="totalRuns" class="value">0</span>
                </div>
            </div>

            <div class="batting-options" id="battingOptions">
                <button class="bat-btn" data-run="1">1</button>
                <button class="bat-btn" data-run="2">2</button>
                <button class="bat-btn" data-run="3">3</button>
                <button class="bat-btn" data-run="4">4</button>
                <button class="bat-btn" data-run="5">5</button>
                <button class="bat-btn" data-run="6">6</button>
            </div>

            <div id="status" class="status-text">Select a number to play!</div>

            <div class="out-message" id="outMessage" style="display: none;">
                <p id="finalScore">0 - 0</p>
                <button id="resetBtn">Play Again</button>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
