<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Odd Cricket Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>Odd Cricket Game</h1>
        <div class="scoreboard">
            <div class="score-item">
                <span class="label">Total Runs</span>
                <span id="totalRuns" class="value">0</span>
            </div>
            <div class="score-item">
                <span class="label">Status</span>
                <span id="status" class="value">Pick a number (1-6) to bat!</span>
            </div>
        </div>
        <div class="bowler-choice">
            <p>Bowler's last choice: <span id="bowlerChoice">-</span></p>
        </div>
        <div class="batting-options" id="battingOptions">
            <button class="bat-btn" data-run="1">1</button>
            <button class="bat-btn" data-run="2">2</button>
            <button class="bat-btn" data-run="3">3</button>
            <button class="bat-btn" data-run="4">4</button>
            <button class="bat-btn" data-run="5">5</button>
            <button class="bat-btn" data-run="6">6</button>
        </div>
        <div class="out-message" id="outMessage" style="display: none;">
            <p>You're out! Final score: <span id="finalScore">0</span> runs.</p>
            <button id="resetBtn">Play Again</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
